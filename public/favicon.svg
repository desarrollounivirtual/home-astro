<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c53" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#0b1120" />
  <rect width="96" height="96" x="2" y="2" rx="20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  
  <!-- Abstract U Shape / Portal -->
  <path d="M 30,30 L 30,55 A 20,20 0 0,0 70,55 L 70,30" fill="none" stroke="url(#blueGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 42,30 L 42,55 A 8,8 0 0,0 58,55 L 58,30" fill="none" stroke="url(#orangeGrad)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Sparkle dot -->
  <circle cx="50" cy="55" r="4" fill="#ffffff" filter="url(#glow)" />
</svg>
